<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Criatório Sertori">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a44"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Moldura hexagonal -->
  <polygon points="60,5 108,32.5 108,87.5 60,115 12,87.5 12,32.5"
           fill="#060b18" stroke="url(#neon)" stroke-width="3" filter="url(#brilho)"/>
  <polygon points="60,13 101,36.5 101,83.5 60,107 19,83.5 19,36.5"
           fill="none" stroke="#00f0ff" stroke-opacity=".25" stroke-width="1"/>

  <g filter="url(#brilho)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Topete (calopsita) -->
    <path d="M53 47 C 46 40, 38 36, 36 28 C 35 25, 37 24, 40 26" fill="none" stroke="#00f0ff" stroke-width="3.2"/>
    <path d="M58 44 C 54 36, 48 28, 49 21 C 49 18, 52 18, 53 21" fill="none" stroke="#7af8ff" stroke-width="3"/>
    <path d="M63 43 C 62 36, 60 28, 63 22 C 64 20, 67 21, 66 24" fill="none" stroke="#b026ff" stroke-width="2.8"/>

    <!-- Cabeça e peito -->
    <path d="M42 96 C 34 76, 36 54, 54 45 C 68 39, 82 45, 86 58
             C 93 60, 95 69, 88 76 C 86 71, 83 69, 80 69
             C 78 80, 70 92, 62 98 Z"
          fill="url(#corpo)" stroke="url(#neon)" stroke-width="3"/>

    <!-- Bico -->
    <path d="M86 58 C 93 60, 95 69, 88 76 C 86 71, 83 69, 80 69 Z"
          fill="#f59e0b" stroke="#ffd27a" stroke-width="1.6"/>

    <!-- Bochecha laranja -->
    <circle cx="71" cy="66" r="5.5" fill="#ff7a2f" fill-opacity=".9"/>

    <!-- Olho -->
    <circle cx="71" cy="55" r="3.6" fill="#00f0ff"/>
    <circle cx="72" cy="54" r="1.2" fill="#ffffff"/>
  </g>
</svg>
